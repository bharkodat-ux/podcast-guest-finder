<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Podcast Guest Finder</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>Podcast Guest Finder</h1>
    <div class="controls">
      <input id="q" placeholder="Search name, bio, or topic..." />
      <input id="topics" placeholder="Filter by topics (comma separated)" />
      <button id="search">Search</button>
      <button id="reset">Reset</button>
    </div>
    <div id="results">Loading guests…</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
